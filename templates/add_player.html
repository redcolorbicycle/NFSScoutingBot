{% extends "base.html" %}
{% block title %} — Add Player{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2>Add Player</h2>
  <a href="{{ url_for('clubs') }}" class="btn btn-outline-secondary btn-sm">← Back</a>
</div>

<form method="post">
  <div class="card bg-dark border-secondary mb-4">
    <div class="card-body">
      <h6 class="card-title text-secondary text-uppercase small mb-3">Basic Info</h6>
      <div class="row g-3">
        <div class="col-md-3">
          <label class="form-label">Name <span class="text-danger">*</span></label>
          <input type="text" name="name" class="form-control" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">Club</label>
          <select name="club_name" class="form-select">
            <option value="no club">no club</option>
            {% for c in clubs %}
            <option value="{{ c }}">{{ c }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">PR</label>
          <input type="number" name="pr" class="form-control" value="9999">
        </div>
        <div class="col-md-2">
          <label class="form-label">Nerf</label>
          <input type="text" name="nerf" class="form-control" placeholder="e.g. yes">
        </div>
        <div class="col-md-3">
          <label class="form-label">Team Deck</label>
          <input type="text" name="team_name" class="form-control">
        </div>
        <div class="col-md-2">
          <label class="form-label">Char Bats</label>
          <input type="number" name="charbats" class="form-control" value="0" min="0">
        </div>
        <div class="col-md-2">
          <label class="form-label">Tool Bats</label>
          <input type="number" name="toolbats" class="form-control" value="0" min="0">
        </div>
        <div class="col-md-3">
          <label class="form-label">Source</label>
          <input type="text" name="source" class="form-control">
        </div>
      </div>
    </div>
  </div>

  <div class="card bg-dark border-secondary mb-4">
    <div class="card-body">
      <h6 class="card-title text-secondary text-uppercase small mb-3">Special Players</h6>
      <div class="row g-3">
        {% for i in range(1, 6) %}
        <div class="col-md-2">
          <label class="form-label">SP{{ i }} Name</label>
          <input type="text" name="sp{{ i }}_name" class="form-control form-control-sm">
        </div>
        <div class="col-md-{% if i < 5 %}10{% else %}10{% endif %}">
          <label class="form-label">SP{{ i }} Skills</label>
          <input type="text" name="sp{{ i }}_skills" class="form-control form-control-sm">
        </div>
        {% endfor %}
      </div>
    </div>
  </div>

  <div class="d-flex gap-2">
    <button type="submit" class="btn btn-success">Add Player</button>
    <a href="{{ url_for('clubs') }}" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>
{% endblock %}
