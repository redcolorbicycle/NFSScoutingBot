<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NFSBot{% block title %}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #12121e; }
    .pr-badge { font-weight: bold; padding: 2px 10px; border-radius: 4px; color: #111; font-size: .85em; }
    .table td, .table th { vertical-align: middle; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark border-bottom border-secondary">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold" href="{{ url_for('clubs') }}">⚾ NFSBot</a>
      <div class="d-flex gap-3 align-items-center">
        <a class="nav-link text-light" href="{{ url_for('add_player') }}">+ Add Player</a>
        <a class="nav-link text-secondary" href="{{ url_for('logout') }}">Logout</a>
      </div>
    </div>
  </nav>
  <div class="container-fluid px-4 mt-4" style="max-width:1400px">
    {% for cat, msg in get_flashed_messages(with_categories=true) %}
      <div class="alert alert-{{ cat }} alert-dismissible fade show py-2" role="alert">
        {{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
    {% block content %}{% endblock %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
